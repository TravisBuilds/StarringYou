<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarringYou - Enroll Your Face</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      flex: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #cbd5e1;
    }

    .enrollment-box {
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto 1.5rem;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .face-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      pointer-events: none;
    }

    .guide-ring {
      fill: none;
      stroke: rgba(99, 102, 241, 0.5);
      stroke-width: 3;
    }

    .instruction {
      text-align: center;
      font-size: 1.25rem;
      color: #f1f5f9;
      margin-bottom: 1rem;
      min-height: 2em;
    }

    .step-indicators {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #334155;
      transition: all 0.3s;
    }

    .step-dot.completed {
      background: #10b981;
    }

    .step-dot.active {
      background: #6366f1;
      transform: scale(1.3);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #6366f1;
      color: white;
      display: inline-block;
    }

    .btn-primary:hover {
      background: #4f46e5;
    }

    .btn-secondary {
      background: #64748b;
      color: white;
      margin-left: 0.5rem;
    }

    .controls {
      text-align: center;
    }

    .success-message {
      background: #10b981;
      color: white;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
    }

    .error-message {
      background: #ef4444;
      color: white;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⭐ StarringYou</h1>
      <p class="subtitle">Enroll your face to see yourself in any outfit</p>
    </header>

    <div id="success-msg" class="success-message">
      ✓ Face enrolled successfully! You can now close this page and start swapping faces on shopping sites.
    </div>

    <div id="error-msg" class="error-message"></div>

    <div class="enrollment-box">
      <div class="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        <div class="face-guide">
          <svg viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="80" class="guide-ring" />
          </svg>
        </div>
      </div>

      <p id="instruction" class="instruction">Click Start to begin enrollment</p>

      <div id="step-indicators" class="step-indicators">
        <div class="step-dot"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <div class="controls">
        <button id="start-btn" class="btn btn-primary">Start Enrollment</button>
        <button id="restart-btn" class="btn btn-secondary" style="display: none;">Restart</button>
      </div>
    </div>
  </div>

  <footer>
    <p>🔒 Your face data is stored locally on your device and never uploaded to any server</p>
  </footer>

  <canvas id="canvas" style="display: none;"></canvas>
  
  <script type="module">
    // Simple enrollment logic for extension
    // This is a simplified version - the full web app has more features
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const instruction = document.getElementById('instruction');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const successMsg = document.getElementById('success-msg');
    const errorMsg = document.getElementById('error-msg');
    const stepIndicators = document.querySelectorAll('.step-dot');

    let stream = null;
    let currentStep = 0;
    const steps = [
      'Look straight at the camera',
      'Turn your head to the left',
      'Turn your head to the right',
      'Tilt your head up',
      'Tilt your head down',
      'Blink your eyes'
    ];

    // Initialize camera
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720, facingMode: 'user' }
        });
        video.srcObject = stream;
        await video.play();
        startBtn.style.display = 'inline-block';
        instruction.textContent = 'Click Start to begin enrollment';
      } catch (error) {
        showError('Camera access denied. Please allow camera access to enroll your face.');
      }
    }

    // Start enrollment
    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      restartBtn.style.display = 'inline-block';
      currentStep = 0;
      nextStep();
    });

    // Restart
    restartBtn.addEventListener('click', () => {
      currentStep = 0;
      successMsg.style.display = 'none';
      updateStepIndicators();
      nextStep();
    });

    // Simple step progression (user manually advances)
    function nextStep() {
      if (currentStep >= steps.length) {
        completeEnrollment();
        return;
      }

      instruction.textContent = steps[currentStep];
      updateStepIndicators();

      // Auto-advance after 3 seconds
      setTimeout(() => {
        captureFrame();
        currentStep++;
        nextStep();
      }, 3000);
    }

    function updateStepIndicators() {
      stepIndicators.forEach((dot, idx) => {
        dot.classList.remove('active', 'completed');
        if (idx < currentStep) {
          dot.classList.add('completed');
        } else if (idx === currentStep) {
          dot.classList.add('active');
        }
      });
    }

    // Capture frame
    function captureFrame() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      // Frame captured - in real implementation would save to storage
    }

    // Complete enrollment
    async function completeEnrollment() {
      instruction.textContent = 'Processing enrollment...';

      // Capture final frontal frame
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

      // Save to extension storage
      const enrollmentData = {
        frontalFrame: dataUrl,
        enrolledAt: Date.now()
      };

      await chrome.storage.local.set({ 
        enrollmentData,
        enabled: true // Auto-enable after enrollment
      });

      successMsg.style.display = 'block';
      instruction.textContent = 'Enrollment complete!';
      restartBtn.textContent = 'Re-enroll';

      // Stop camera
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    }

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
    }

    // Initialize on load
    initCamera();
  </script>
</body>
</html>
