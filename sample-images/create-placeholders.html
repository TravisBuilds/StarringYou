<!DOCTYPE html>
<html>
<head>
  <title>Create Sample Image Placeholders</title>
</head>
<body>
  <h2>Generating placeholder images...</h2>
  <p>Check your Downloads folder for the 4 placeholder images.</p>
  <script>
    const samples = [
      { name: 'model-1.jpg', color: '#6366f1', label: 'Casual\nJacket' },
      { name: 'model-2.jpg', color: '#ec4899', label: 'Business\nSuit' },
      { name: 'model-3.jpg', color: '#f59e0b', label: 'Summer\nDress' },
      { name: 'model-4.jpg', color: '#10b981', label: 'Winter\nCoat' }
    ];

    samples.forEach(sample => {
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 1000;
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = sample.color;
      ctx.fillRect(0, 0, 800, 1000);
      
      // Add gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, 1000);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 800, 1000);
      
      // Text
      ctx.fillStyle = 'white';
      ctx.font = 'bold 60px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const lines = sample.label.split('\n');
      lines.forEach((line, idx) => {
        ctx.fillText(line, 400, 450 + idx * 80);
      });
      
      ctx.font = '30px sans-serif';
      ctx.fillText('PLACEHOLDER', 400, 650);
      ctx.fillText('Replace with real image', 400, 690);
      
      // Download
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = sample.name;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/jpeg', 0.9);
    });
    
    setTimeout(() => {
      document.body.innerHTML += '<p style="color: green;">✓ Done! Check your Downloads folder.</p>';
    }, 1000);
  </script>
</body>
</html>
